name: Validate GestãoCasa
on:
  push:
    branches: [main, fix/rateios-e-acesso-local]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm test
